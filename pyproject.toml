[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "spherex"
version = "0.1.0"
description = "Modular SPHEREx PSF photometry pipeline in JAX + Equinox"
requires-python = ">=3.10"
dependencies = [
    "jax>=0.4.30",
    "equinox>=0.11.0",
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "matplotlib>=3.7",
]

[tool.setuptools.packages.find]
include = ["spherex*"]
